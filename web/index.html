<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>line demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div>
          <h1>line demo</h1>
          <p id="status">Disconnected</p>
        </div>
        <div class="actions">
          <button id="connect" type="button">Connect</button>
          <button id="disconnect" type="button" disabled>Disconnect</button>
          <button id="reset" type="button">Clear</button>
        </div>
      </section>

      <section class="grid">
        <article>
          <h2>Conversation</h2>
          <ol id="events" class="feed"></ol>
        </article>
        <article>
          <h2>Agent Runs</h2>
          <ol id="agent-runs" class="feed"></ol>
        </article>
        <article>
          <h2>Usage</h2>
          <pre id="usage">{}</pre>
        </article>
        <article>
          <h2>Logs</h2>
          <pre id="logs"></pre>
        </article>
      </section>
      <div id="remote-audio" aria-hidden="true"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
