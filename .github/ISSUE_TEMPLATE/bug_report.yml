name: Bug report
description: Report a reproducible problem with line.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, device type, iOS version, and gateway logs when relevant.
      placeholder: |
        1. Run ...
        2. Pair ...
        3. Say ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        macOS:
        Python:
        uv:
        Xcode:
        iPhone/iOS:
        Agent backend:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste only redacted logs. Never include API keys, room tokens, or pairing state.
      render: text
