name: Feature request
description: Suggest an improvement for line.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow should become easier or possible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest version that would solve it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - iOS app
        - gateway
        - agent backend
        - speech provider
        - docs
        - other
    validations:
      required: true
